services:
  - type: web
    name: wp-cashbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN        # from @BotFather (set in Render dashboard, never in code)
        sync: false
      - key: ADMIN_ID         # your numeric Telegram ID (get it from @userinfobot)
        sync: false
      - key: BOT_USERNAME     # bot username, with or without @
        sync: false
      - key: DB_PATH          # SQLite file path
        value: wpcash.db
